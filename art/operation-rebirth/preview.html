<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LAST STOP · Rebirth asset inspection</title><link rel="stylesheet" href="rebirth.css"><style>
body{margin:0}main{max-width:480px;margin:auto;padding:20px 12px calc(90px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}h1{font-size:22px;letter-spacing:.17em;margin:0}h2{font-size:19px;margin:0 0 8px}h3{font-size:15px;margin:0}p{margin:8px 0}small,.eyebrow{font-size:11px;letter-spacing:.12em;color:#6bddda}.scene{width:100%;display:block;aspect-ratio:16/9;background:#10121d}.caption{font-size:12px;padding:8px 12px;margin:0;background:#202039}section{margin-top:14px}.tabs{display:flex;position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:3px;background:#10121d;border-top:1px solid #c99b54;z-index:3}.tabs button{flex:1;padding:3px;background:transparent;border:0;font-size:11px}.tabs img{display:block;width:24px;height:24px;margin:0 auto 2px}.tabs button[aria-selected=true]{color:#ffcf7a;background:#292640}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.portrait{width:96px;height:96px;float:left;margin-right:12px}.dialogue{min-height:135px}.clear{clear:both}.repair{display:flex;align-items:center;gap:12px;min-height:44px;border-top:1px solid #37314c}.repair input{width:20px;height:20px;accent-color:#c99b54}.muted{color:#b6a383}.notice{font-size:12px;color:#b6a383;margin-top:16px}button.wide{width:100%}.tokens{display:flex;gap:3px;flex-wrap:wrap}.token{width:16px;height:16px} .hidden{display:none}
</style></head><body class="rebirth"><main><header><div><div class="eyebrow">ASHVALE · ART PACK 1.0</div><h1>LAST STOP</h1></div><small>NO. 9</small></header><canvas class="scene" width="384" height="216" aria-label="Layered Ashvale scene"></canvas><p class="caption">Rain on the platform. A light still waiting.</p><div id="content"></div><p class="notice">Asset inspection preview. No gameplay or save data is changed.</p></main><nav class="tabs" aria-label="Asset categories"></nav><script>
const $=s=>document.querySelector(s), state={tab:'station',repairs:new Set(),expression:'neutral'},cache={};
const repairs=['fireboxDoor','headlamp','dryCab','reinforcedStorage','boiler'],repairNames=['Firebox Door','Restored Headlamp','A Dry Cab','Reinforced Tender','Boiler Components'];
const items=['scrapIron','coalLump','glassShard','copperWire','brassCog','signalRelay','cyanPrism','oakTimber','steelRivets','pressureGauge','ironPlate','fuelBrick','polishedLens','copperCoil','timberBeam','patchPanel','gaugeAssembly'];const discoveries=['tornTimetable','kilnToken','knittedMitten','stoppedWatch','signalLog','shedKey','hummingRelay','stationPhoto','firemansLedger','kilnPlans','coldValve','cyanDisc'];const pretty=s=>s.replace(/([A-Z])/g,' $1').replace(/^./,x=>x.toUpperCase());
function load(p){return cache[p]||(cache[p]=new Promise((ok,no)=>{const i=new Image;i.onload=()=>ok(i);i.onerror=()=>no(Error(p));i.src='assets/'+p}))}
async function draw(){const c=$('canvas'),x=c.getContext('2d');x.imageSmoothingEnabled=false;const layers=['sky','skyline','station_buildings','platform_architecture','tracks_ground'];x.clearRect(0,0,384,216);for(const p of layers)x.drawImage(await load('environments/'+p+'.png'),0,0);for(const [p,a,b]of [['shed_closed',0,108],['cyanSignal',334,100],['bench',73,113],['luggage',127,116],['ashPlanter',41,113],['stationSign',199,102],['cabinet_closed',310,112]])x.drawImage(await load('environments/'+p+'.png'),a,b);x.drawImage(await load('locomotive/no9_base_damaged.png'),99,95);for(const id of repairs)if(state.repairs.has(id))x.drawImage(await load('locomotive/repair_'+id+'.png'),99,95);x.drawImage(await load('characters/mara_figure_0.png'),63,110);x.drawImage(await load('characters/conductor_figure_0.png'),85,112)}
const tabs=[['station','Station'],['train','Repairs'],['satchel','Items'],['journal','People'],['skills','Interface']];$('.tabs').innerHTML=tabs.map(([id,label])=>`<button data-tab="${id}" aria-selected="${id===state.tab}"><img src="assets/ui/${id}.png" alt="">${label}</button>`).join('');$('.tabs').onclick=e=>{const b=e.target.closest('button');if(b){state.tab=b.dataset.tab;render()}};
function grid(arr){return '<div class="grid">'+arr.map(id=>{const rarity=['brassCog','cyanPrism','pressureGauge','patchPanel','gaugeAssembly'].includes(id)?'rare':['copperWire','signalRelay','steelRivets','polishedLens','copperCoil','timberBeam'].includes(id)?'uncommon':'common';return `<div class="rb-slot ${rarity}"><img src="assets/items/${id}.png" alt=""><span>${pretty(id)}</span><small>${items.includes(id)?rarity:'discovery'}</small></div>`}).join('')+'</div>'}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===state.tab));let html='';if(state.tab==='station')html=`<section class="rb-frame"><div class="eyebrow">CHAPTER ONE</div><h2>The Cyan Signal</h2><p>Rebuild a shelter. Find out where the line ends.</p><div class="rb-progress" role="progressbar" aria-label="Repairs preview" aria-valuemin="0" aria-valuemax="5" aria-valuenow="${state.repairs.size}"><span style="width:${state.repairs.size/5*100}%"></span></div><p class="muted">${state.repairs.size} of 5 systems restored</p><button class="rb-button wide" id="all">${state.repairs.size===5?'Show damaged train':'Preview fully repaired train'}</button></section><section class="rb-frame rb-wood dialogue"><img class="portrait" src="assets/characters/mara_neutral.png" alt="Mara Venn"><div class="eyebrow">NIGHT SIGNALWOMAN</div><h3>Mara Venn</h3><p>“That engine is No. 9. Last train out of Ashvale. Except it never left.”</p><div class="clear"></div></section>`;
if(state.tab==='train')html=`<section class="rb-frame rb-engineering"><div class="eyebrow">ALIGNED REPAIR OVERLAYS</div><h2>Bring No. 9 back to life</h2><p class="muted">Toggle any combination. Wheels and chassis remain fixed.</p>${repairs.map((id,i)=>`<label class="repair"><input type="checkbox" data-repair="${id}" ${state.repairs.has(id)?'checked':''}>${repairNames[i]}</label>`).join('')}</section>`;
if(state.tab==='satchel')html='<section><h2>Materials & components</h2>'+grid(items)+'</section><section><h2>Story discoveries</h2>'+grid(discoveries)+'</section>';
if(state.tab==='journal')html=['conductor','mara','tobin'].map((id,i)=>`<section class="rb-frame rb-wood"><h2>${['The Conductor','Mara Venn','Tobin Harrow'][i]}</h2><div class="grid">${['neutral','concerned','relieved'].map(e=>`<div><img style="width:100%;height:auto" src="assets/characters/${id}_${e}.png" alt="${e}"><small>${e}</small></div>`).join('')}</div><img src="assets/characters/${id}_poses.png" style="width:192px;height:96px" alt="Three character poses"></section>`).join('');
if(state.tab==='skills')html=`<section class="rb-frame rb-ceramic"><div class="eyebrow">SCAVENGING</div><h2>Derelict Platform</h2><p>Dark iron, ceramic and lamplight. All interface text remains live browser text.</p><button class="rb-button">Primary button</button><button class="rb-button" disabled>Disabled</button></section><section class="rb-frame rb-engineering"><h2>Engineering</h2><p>Recipe, repair and skill panels share this frame.</p>${grid(['ironPlate','copperCoil','gaugeAssembly'])}</section><section class="rb-frame"><h2>Small effect sheets</h2><span class="rb-fx rb-rain"></span><span class="rb-fx rb-steam"></span><span class="rb-fx rb-signal"></span><span class="rb-fx rb-discovery"></span><p class="muted">Reduced motion hides rain, steam and sparkles; lights freeze.</p></section>`;
$('#content').innerHTML=html;$('#all')?.addEventListener('click',()=>{state.repairs=state.repairs.size===5?new Set():new Set(repairs);draw();render()});document.querySelectorAll('[data-repair]').forEach(i=>i.onchange=()=>{i.checked?state.repairs.add(i.dataset.repair):state.repairs.delete(i.dataset.repair);draw()});}
render();draw().then(()=>window.artReady=true).catch(e=>{document.body.dataset.error=e.message;console.error(e)});
</script></body></html>
