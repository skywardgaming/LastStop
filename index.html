<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0a10" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Last Stop" />
    <meta name="description" content="LAST STOP — an idle railway mystery. Restore Locomotive No. 9 at Ashvale Station." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%230b0a10'/%3E%3Crect x='2' y='5' width='5' height='6' fill='%231f3a33'/%3E%3Crect x='7' y='7' width='7' height='4' fill='%231f3a33'/%3E%3Crect x='11' y='4' width='2' height='3' fill='%231f3a33'/%3E%3Crect x='4' y='9' width='2' height='2' fill='%23ffae4a'/%3E%3Crect x='13' y='2' width='2' height='2' fill='%235fe3d6'/%3E%3Crect x='1' y='12' width='14' height='1' fill='%23968a98'/%3E%3C/svg%3E" />
    <title>LAST STOP · Ashvale</title>
  </head>
  <body>
    <div class="app">
      <header class="hud">
        <div class="brand">
          <h1>LAST STOP</h1>
          <span>Ashvale Station</span>
        </div>
        <span id="save-status" class="save-status" aria-live="polite"></span>
      </header>

      <div id="scene-wrap" class="scene-wrap">
        <canvas id="scene" class="scene" width="256" height="144" aria-label="Ashvale Station and Locomotive No. 9 in the rain"></canvas>
        <div id="toasts" class="toasts" aria-live="polite"></div>
        <p id="scene-caption" class="scene-caption"></p>
      </div>

      <main id="panel" class="panel"></main>

      <footer class="footer">
        <span>Ashvale 0.3 &middot; art by Astra</span>
        <button id="reset" class="btn-link" type="button">Reset save</button>
      </footer>
    </div>

    <div class="dock">
      <div id="nowbar" class="nowbar">
        <button id="nowbar-main" class="nowbar-main" type="button" aria-label="Current activity">
          <span class="now-top"><span id="now-label">Idle</span><span id="now-level" class="mono"></span></span>
          <span class="bar thin"><span class="bar-fill" data-live="activity"></span></span>
        </button>
        <button id="now-stop" class="now-stop" type="button" hidden>Stop</button>
      </div>
      <nav id="tabbar" class="tabbar" aria-label="Main"></nav>
    </div>

    <div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden>
      <div id="sheet-backdrop" class="sheet-backdrop"></div>
      <div class="sheet-panel"><div class="sheet-grip"></div><div id="sheet-body"></div></div>
    </div>

    <div id="onboarding" class="onboarding" hidden></div>

    <div id="blocked" class="blocked" hidden>
      <p>LAST STOP is already running in another tab. Close it, then reload this one.</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
